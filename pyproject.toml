[tool.poetry]
name = "adk-examples"
version = "0.1.0"
description = "Minimal Google ADK example with ADC-first local dev"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
# Placeholder until the official ADK package name is confirmed
# Replace with the correct package, e.g., "google-adk" or official name
google-adk = "*"
google-generativeai = "*"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
ruff = "^0.6.9"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"